name: CI

on:
  push:
  pull_request:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt pytest ruff
      - run: cd backend && ruff check app tests
      - run: cd backend && pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd frontend && npm ci
      - run: cd frontend && npm run typecheck
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run test
      - run: cd frontend && npm run build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mbc_test
          POSTGRES_PASSWORD: mbc_test_password
          POSTGRES_DB: mbc_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U mbc_test -d mbc_test"
          --health-interval 2s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt pytest
      - name: Start Celery worker (real Redis, mock provider)
        run: |
          cd backend
          export DATABASE_URL="postgresql+psycopg2://mbc_test:mbc_test_password@localhost:5433/mbc_test"
          export CELERY_BROKER_URL="redis://localhost:6380/0"
          export AI_ENABLED=true AI_PROVIDER=mock AI_PHI_APPROVED=false
          export MOCK_PROVIDER_RESPONSE='{"diagnoses":[{"code":"F32.9","code_type":"icd10cm","evidence":[{"quote":"major depressive disorder","start":0,"end":0}]}],"procedures":[],"modifiers":[],"missing_documentation":[],"contradictions":[]}'
          celery -A app.celery_app.celery_app worker --concurrency=2 &
          sleep 5
      - name: Run real PostgreSQL + Redis integration tests
        run: |
          cd backend
          export TEST_POSTGRES_URL="postgresql+psycopg2://mbc_test:mbc_test_password@localhost:5433/mbc_test"
          export TEST_REDIS_URL="redis://localhost:6380/0"
          pytest integration_tests -v

  e2e:
    runs-on: ubuntu-latest
    needs: [integration]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f infra/docker-compose.test.yml up -d --build
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd e2e && npm ci && npx playwright install --with-deps chromium
      - name: Run browser E2E
        run: |
          cd e2e
          E2E_BASE_URL=http://localhost:3001 E2E_API_URL=http://localhost:8001 npx playwright test
      - run: docker compose -f infra/docker-compose.test.yml down -v --remove-orphans
        if: always()

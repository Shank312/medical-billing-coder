# Local development stack. Run from the repo root:
#   docker compose -f infra/docker-compose.yml --env-file .env up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mbc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-mbc}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mbc}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ../backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-mbc}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-mbc}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me-please}
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:-dev-hmac-change-me-please}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
      COOKIE_SECURE: "false"
      CORS_ORIGINS: http://localhost:3000
      RATE_LIMIT_ENABLED: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ../frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
